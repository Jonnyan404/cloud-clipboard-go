name: Build OpenWrt Packages

on:
  workflow_call:
    inputs:
      version:
        description: '版本号 (不含v前缀)'
        required: true
        type: string
  workflow_dispatch: # 允许手动触发
    inputs:
      version:
        description: '版本号 (不含v前缀)'
        required: true
        default: '5.0.4'

permissions:
  contents: read

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Create directory structure
        run: |
          mkdir -p openwrt/build

      - name: Build binary
        run: |
          chmod +x openwrt/scripts/build.sh
          ./openwrt/scripts/build.sh ${{ inputs.version }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-binaries-${{ inputs.version }}
          path: openwrt/build/cloud-clipboard-${{ inputs.version }}-*

  build-ipk:
    runs-on: ubuntu-latest
    needs: build-binaries
    strategy:
      matrix:
        arch: [x86_64, arm_cortex-a5, arm_cortex-a7, arm_cortex-a8, arm_cortex-a9, arm_cortex-a15_neon-vfpv4, aarch64, mips_24kc, mipsel_24kc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create directory structure
        run: |
          mkdir -p openwrt/build

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: openwrt-binaries-${{ inputs.version }}
          path: openwrt/build

      - name: Package IPK
        run: |
          chmod +x openwrt/scripts/package-openwrt.sh
          ./openwrt/scripts/package-openwrt.sh ${{ inputs.version }} ${{ matrix.arch }}

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CCG_server-openwrt-ipk-${{ matrix.arch }}-v${{ inputs.version }}.ipk
          path: openwrt/build/CCG_server-openwrt-ipk-${{ matrix.arch }}-v${{ inputs.version }}.ipk

  build-apk:
    runs-on: ubuntu-latest
    needs: build-binaries
    strategy:
      matrix:
        include:
          - binary_arch: x86_64
            apk_arch: x86_64
          - binary_arch: arm_cortex-a5
            apk_arch: arm_cortex-a5_vfpv4
          - binary_arch: arm_cortex-a7
            apk_arch: arm_cortex-a7
          - binary_arch: arm_cortex-a7
            apk_arch: arm_cortex-a7_neon-vfpv4
          - binary_arch: arm_cortex-a7
            apk_arch: arm_cortex-a7_vfpv4
          - binary_arch: arm_cortex-a8
            apk_arch: arm_cortex-a8_vfpv3
          - binary_arch: arm_cortex-a9
            apk_arch: arm_cortex-a9
          - binary_arch: arm_cortex-a9
            apk_arch: arm_cortex-a9_neon
          - binary_arch: arm_cortex-a9
            apk_arch: arm_cortex-a9_vfpv3-d16
          - binary_arch: arm_cortex-a15_neon-vfpv4
            apk_arch: arm_cortex-a15_neon-vfpv4
          - binary_arch: aarch64
            apk_arch: aarch64_generic
          - binary_arch: aarch64
            apk_arch: aarch64_cortex-a53
          - binary_arch: aarch64
            apk_arch: aarch64_cortex-a72
          - binary_arch: aarch64
            apk_arch: aarch64_cortex-a76
          - binary_arch: mips_24kc
            apk_arch: mips_24kc
          - binary_arch: mipsel_24kc
            apk_arch: mipsel_24kc

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create directory structure
        run: |
          mkdir -p openwrt/build

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: openwrt-binaries-${{ inputs.version }}
          path: openwrt/build

      - name: Package APK
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:edge \
            sh -lc '
              apk add --no-cache bash >/dev/null
              chmod +x openwrt/scripts/package-openwrt-apk.sh
              bash ./openwrt/scripts/package-openwrt-apk.sh ${{ inputs.version }} ${{ matrix.binary_arch }} ${{ matrix.apk_arch }}
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CCG_server-openwrt-apk-${{ matrix.apk_arch }}-v${{ inputs.version }}.apk
          path: openwrt/build/CCG_server-openwrt-apk-${{ matrix.apk_arch }}-v${{ inputs.version }}.apk

  build-luci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create directory structure
        run: |
          mkdir -p openwrt/build
          # 设置权限，递归为所有文件增加可执行权限
          find openwrt/luci-app-cloud-clipboard -type f -exec chmod +x {} \;
      
      - name: Package LuCI IPK
        run: |
          chmod +x openwrt/scripts/package-luci-app.sh
          ./openwrt/scripts/package-luci-app.sh ${{ inputs.version }}

      - name: Package LuCI APK
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:edge \
            sh -lc '
              apk add --no-cache bash >/dev/null
              chmod +x openwrt/scripts/package-luci-app-apk.sh
              bash ./openwrt/scripts/package-luci-app-apk.sh ${{ inputs.version }}
            '
      
      - name: Upload LuCI IPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CCG_server-luci-ipk-all-v${{ inputs.version }}.ipk
          path: openwrt/build/CCG_server-luci-ipk-all-v${{ inputs.version }}.ipk

      - name: Upload LuCI APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CCG_server-luci-apk-noarch-v${{ inputs.version }}.apk
          path: openwrt/build/CCG_server-luci-apk-noarch-v${{ inputs.version }}.apk