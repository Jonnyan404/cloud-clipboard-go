name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Cloudflare Credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 CF_API_TOKEN / CLOUDFLARE_API_TOKEN Secret，请在仓库 Settings -> Secrets 中配置"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-vue3/package-lock.json

      - name: Install Wrangler
        run: npm install -g wrangler@^4.59.3

      - name: Build Vue3 frontend (web-vue3)
        working-directory: web-vue3
        run: |
          npm ci
          npm run build

      - name: Copy built assets to Worker static assets
        run: |
          rm -rf cloudflare/workers/assets
          mkdir -p cloudflare/workers/assets
          for item in web-vue3/dist/*; do
            case "$(basename "$item")" in
              *.gz|*.br) continue ;;
            esac
            cp -R "$item" cloudflare/workers/assets/
          done
          echo "assets 文件数: $(find cloudflare/workers/assets -type f | wc -l | tr -d ' ')"

      - name: Setup Cloudflare Resources (D1 & R2)
        working-directory: cloudflare/workers
        run: |
          # 1. 确保 R2 存储桶存在
          wrangler r2 bucket create cloud-clipboard-files || echo "R2 bucket 已存在或已创建"

          # 2. 获取或自动创建 D1 数据库
          cp wrangler.toml.template wrangler.toml
          D1_ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="cloud-clipboard-db") | .uuid' 2>/dev/null || true)
          if [ -z "${D1_ID}" ] || [ "${D1_ID}" = "null" ]; then
            echo "未找到现有 D1 数据库，正在自动创建 cloud-clipboard-db..."
            CREATE_OUTPUT=$(wrangler d1 create cloud-clipboard-db)
            D1_ID=$(echo "$CREATE_OUTPUT" | grep -o 'database_id = "[^"]*"' | cut -d'"' -f2 || true)
          fi

          if [ -z "${D1_ID}" ] || [ "${D1_ID}" = "null" ]; then
            echo "::error::未能获取到 D1 数据库 ID，请检查 Cloudflare Token 权限 (D1:Edit)"
            exit 1
          fi

          echo "D1 database id: ${D1_ID}"
          sed -i "s/database_id = \"your-d1-database-id\"/database_id = \"${D1_ID}\"/" wrangler.toml
          grep -n "database_id" wrangler.toml

      - name: Run D1 migrations (remote)
        working-directory: cloudflare/workers
        run: wrangler d1 execute cloud-clipboard-db --file=../d1/schema.sql --remote --yes

      - name: Deploy Worker
        working-directory: cloudflare/workers
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          ROOM_AUTH_JSON: ${{ secrets.ROOM_AUTH_JSON }}
          ROOM_LIST: ${{ secrets.ROOM_LIST }}
          HISTORY_LIMIT: ${{ secrets.HISTORY_LIMIT }}
          TEXT_LIMIT: ${{ secrets.TEXT_LIMIT }}
          FILE_LIMIT: ${{ secrets.FILE_LIMIT }}
          FILE_EXPIRE: ${{ secrets.FILE_EXPIRE }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          keys = [
              "AUTH_PASSWORD",
              "ROOM_AUTH_JSON",
              "ROOM_LIST",
              "HISTORY_LIMIT",
              "TEXT_LIMIT",
              "FILE_LIMIT",
              "FILE_EXPIRE",
          ]

          toml_path = "wrangler.toml"
          with open(toml_path, "r", encoding="utf-8") as f:
              toml = f.read()

          for k in keys:
              v = os.environ.get(k, "")
              if not v:
                  print(f"::warning::env {k} 未设置，保留模板中的默认值")
                  continue
              pattern = re.compile(r'(?P<key>' + re.escape(k) + r'\s*=\s*)"(?:\\.|[^"\\])*"')
              new_toml, n = pattern.subn(lambda m: m.group("key") + json.dumps(v), toml)
              if n == 0:
                  print(f"::warning::未能匹配到 {k}，该值未替换")
                  continue
              toml = new_toml
              print(f"已替换 {k}")

          with open(toml_path, "w", encoding="utf-8") as f:
              f.write(toml)

          proc = subprocess.Popen(["wrangler", "deploy"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          output_lines = []
          for line in proc.stdout:
              print(line, end="")
              output_lines.append(line)
          proc.wait()

          full_output = "".join(output_lines)
          url_match = re.search(r'https://[^\s]+\.workers\.dev', full_output)
          if url_match:
              worker_url = url_match.group(0)
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as sf:
                      sf.write(f"### 🚀 部署成功！\n\n**Worker URL**: [{worker_url}]({worker_url})\n")

          sys.exit(proc.returncode)
          PY